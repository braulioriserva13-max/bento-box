<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f1f0">
<title>Bento Box</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#f3f1f0}
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;color:#111;overflow-x:hidden}
main{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:max(28px,env(safe-area-inset-top)) 22px max(34px,env(safe-area-inset-bottom))}
.bento{width:min(88vw,620px);display:block;object-fit:contain;user-select:none;-webkit-user-drag:none}
h1{width:min(88vw,620px);margin:22px 0 0;font-size:clamp(38px,12vw,82px);line-height:.9;letter-spacing:-.065em;font-weight:800;text-align:left}
.subtitle{width:min(88vw,620px);margin:10px 0 0;font-size:clamp(13px,3.6vw,20px);line-height:1.1;letter-spacing:.14em;font-weight:700;text-align:left;text-transform:uppercase}

 .bento{width:min(52vw,440px);max-height:68svh}
 h1{margin-top:10px;font-size:clamp(34px,7vw,58px)}
}
@media (min-width:768px){.bento{width:min(68vw,650px)}h1,.subtitle{width:min(68vw,650px)}}

.landscape-lock{
  display:none;
  position:fixed;
  inset:0;
  z-index:9999;
  background:#f3f1f0;
  color:#111;
  padding:32px;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:clamp(24px,4vw,42px);
  line-height:1.08;
  letter-spacing:-.035em;
  font-weight:800;
}
@media (orientation:landscape){
  main{display:none!important}
  .landscape-lock{display:flex}
}

</style>
