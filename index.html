<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f3f1f0">
<title>Bento Box</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;width:100%;min-height:100%;background:#f3f1f0}
body{font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;color:#111;overflow-x:hidden}
main{min-height:100svh;display:flex;flex-direction:column;align-items:center;justify-content:center;padding:max(28px,env(safe-area-inset-top)) 22px max(34px,env(safe-area-inset-bottom))}
.bento{width:min(88vw,620px);display:block;object-fit:contain;user-select:none;-webkit-user-drag:none}
h1{width:min(88vw,620px);margin:22px 0 0;font-size:clamp(38px,12vw,82px);line-height:.9;letter-spacing:-.065em;font-weight:800;text-align:left}
.subtitle{width:min(88vw,620px);margin:10px 0 0;font-size:clamp(13px,3.6vw,20px);line-height:1.1;letter-spacing:.14em;font-weight:700;text-align:left;text-transform:uppercase}
@media (orientation:landscape) and (max-height:600px){
 main{padding-top:18px;padding-bottom:18px}
 .bento{width:min(52vw,440px);max-height:68svh}
 h1{margin-top:10px;font-size:clamp(34px,7vw,58px)}
}
@media (min-width:768px){.bento{width:min(68vw,650px)}h1,.subtitle{width:min(68vw,650px)}}

.landscape-lock{
  display:none;
  position:fixed;
  inset:0;
  z-index:9999;
  background:#f3f1f0;
  color:#111;
  padding:32px;
  align-items:center;
  justify-content:center;
  text-align:center;
  font-size:clamp(24px,4vw,42px);
  line-height:1.08;
  letter-spacing:-.035em;
  font-weight:800;
}
@media (orientation:landscape){
  main{display:none!important}
  .landscape-lock{display:flex}
}


.landing-box{cursor:pointer;-webkit-tap-highlight-color:transparent}
.sub-page{display:none}
body.show-sub #landingPage{display:none}
body.show-sub #subPage{display:flex}
@media (orientation:landscape){
  #landingPage,#subPage{display:none!important}
}


.back-arrow{
  position:fixed;
  top:max(18px,env(safe-area-inset-top));
  left:18px;
  z-index:50;
  width:38px;
  height:38px;
  padding:5px;
  border:0;
  background:transparent;
  color:#111;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.back-arrow svg{width:100%;height:100%;display:block}
.back-arrow path{
  fill:none;
  stroke:currentColor;
  stroke-width:1.6;
  stroke-linecap:round;
  stroke-linejoin:round;
}


#landingPage h1,
#subPage h1{
  width:min(88vw,620px);
  margin:22px 0 0;
  font-size:clamp(38px,12vw,82px);
  line-height:.9;
  letter-spacing:-.065em;
  font-weight:800;
  text-align:left;
}
@media (min-width:768px){
  #landingPage h1,
  #subPage h1{width:min(68vw,650px)}
}


.guess-options{
  width:min(88vw,620px);
  margin:18px 0 0;
  display:flex;
  flex-direction:column;
  gap:2px;
}
.guess-option{
  width:100%;
  border:0;
  background:transparent;
  color:#111;
  padding:5px 0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:18px;
  font:inherit;
  font-size:clamp(38px,12vw,82px);
  line-height:.9;
  letter-spacing:-.065em;
  font-weight:800;
  text-align:left;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
}
.select-box{
  flex:0 0 auto;
  flex:0 0 clamp(52px,15vw,68px);
  width:clamp(52px,15vw,68px);
  height:clamp(52px,15vw,68px);
  border:2px solid #111;
  border-radius:18px;
  position:relative;
  background:transparent;
  transition:transform .16s ease, background .16s ease, border-radius .16s ease;
}
.select-box::before{
  content:"";
  position:absolute;
  inset:8px;
  border:1.5px solid #111;
  border-radius:12px;
  opacity:.28;
  transition:all .16s ease;
}
.select-box::after{
  content:"";
  position:absolute;
  width:8px;
  height:8px;
  left:50%;
  top:50%;
  transform:translate(-50%,-50%) scale(0);
  border-radius:50%;
  background:#fff;
  transition:transform .16s ease;
}
.guess-option{
  min-height:76px;
  border-radius:20px;
}
.guess-option:active .select-box{
  transform:scale(.93);
}
.guess-option.selected .select-box{
  background:#111;
  border-radius:50%;
  transform:rotate(45deg);
}
.guess-option.selected .select-box::before{
  inset:11px;
  border-color:#fff;
  border-radius:50%;
  opacity:1;
}
.guess-option.selected .select-box::after{
  transform:translate(-50%,-50%) scale(1);
}
@media (min-width:768px){
  .guess-options{width:min(68vw,650px)}
}


.guess-options{
  width:min(88vw,620px);
  margin:18px 0 0;
  display:grid;
  gap:10px;
}
.guess-option{
  width:100%;
  min-height:58px;
  margin:0;
  padding:0 17px;
  border:2px dotted #111;
  border-radius:15px;
  background:transparent;
  color:#111;
  display:flex;
  align-items:center;
  justify-content:flex-start;
  font-family:-apple-system,BlinkMacSystemFont,"Helvetica Neue",Arial,sans-serif;
  font-size:clamp(13px,3.6vw,20px);
  line-height:1.1;
  letter-spacing:.14em;
  font-weight:700;
  text-align:left;
  text-transform:uppercase;
  cursor:pointer;
  -webkit-tap-highlight-color:transparent;
  transition:background .22s ease,border-color .22s ease,color .22s ease,transform .14s ease;
}
.guess-option:active{transform:scale(.985)}
.guess-options.has-selection .guess-option{
  background:#ff3da5;
  border-color:#111;
}
.guess-options.has-selection .guess-option[data-country="JAPAN"]{
  background:#baff00;
  border-color:#111;
}
@media (min-width:768px){
  .guess-options{width:min(68vw,650px)}
}


/* v13: subpage image starts at exactly the same vertical position as landing */
#subPage{
  min-height:100svh;
  box-sizing:border-box;
  justify-content:center;
  padding-top:max(20px,env(safe-area-inset-top));
  padding-bottom:max(20px,env(safe-area-inset-bottom));
}
#subPage > .bento{
  width:min(88vw,620px);
  margin:0;
  flex:none;
}
#subPage .guess-options.has-selection .guess-option,
#subPage .guess-options.has-selection .guess-option[data-country="JAPAN"]{
  background:transparent;
  border-color:#111;
}
@media (min-width:768px){
  #subPage > .bento{width:min(68vw,650px)}
}


#subPage .guess-option.selected{
  border-style:solid;
  border-width:2px;
}
</style>
</head>
